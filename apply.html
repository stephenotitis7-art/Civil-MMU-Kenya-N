<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>

<style>

body{
font-family:Arial,sans-sarif;
background:#f4f6f9;
padding:20px;
}
.container{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0, 0, 0, 0.1);
}
h1{
color:#003366;
text-align:center;
}
h1{
color:#003366;
text-align:center;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input, select, textarea{
width:100%
padding:10px;
margin-top:5px;
}
button{
margin-top:20px;
background:#003366;
color:white;
border:none;
padding:12px 20px;
cursor:pointed;
border-radius:5px;
}
button:hover{
background:#00509e;
}
</style>
</head>
<body>

<div class="container">

<h1>Civil Engineering Job Application<h1>
<form>
<label>Full Name</label>
<input type="text" required>

<label>Email Address</label>
<input type="email" required>
<label>Phone Number</label>
<input type="tel" required>
<label>County</label>
<input type="text">

<label>Position Applying For</label>
<select>
<option>Site Engineer</option>
<option>Highway Engineer</option>
<option>Quantity Surveyor</option>
<option>Structural Engineer</option>
</select>

<label>Years of Experience</label>
<input type="text">
<label>Education</label>
<input type="text">
<label>Upload CV</label>
<input type="file">
<label>Why should we hire you?</label>
<textarea rows="5"></textarea>

<button type="submit">Submit Application</button>

</form>

<br>

<a href="jobs.html">- Back to jobs</a>

</div>

</body>
</html>
